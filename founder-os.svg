<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="What I build — core engineering domains">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#0e0e16"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aa0ff"/>
      <stop offset="1" stop-color="#34d9c3"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.028"/>
    </pattern>
    <style>
      .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;}
      .g{fill:none;stroke:url(#acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
      .rule{stroke-dasharray:210;stroke-dashoffset:210;animation:draw 1.6s ease forwards;}
      .r2{animation-delay:.15s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}
      @keyframes draw{to{stroke-dashoffset:0;}}
      .orb{animation:orb 4s ease-in-out infinite;}
      @keyframes orb{50%{transform:translateY(-3px);}}
      .spin{animation:spin 16s linear infinite;transform-box:fill-box;transform-origin:center;}
      @keyframes spin{to{transform:rotate(360deg);}}
      .fade{opacity:0;animation:fade .9s ease forwards;}
      .f2{animation-delay:.2s}.f3{animation-delay:.35s}.f4{animation-delay:.5s}
      @keyframes fade{to{opacity:1;}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#dots)"/>

  <text x="60" y="52" class="mono" font-size="12" letter-spacing="5" fill="#34d9c3">03 — WHAT I BUILD</text>
  <text x="60" y="82" class="sans" font-size="21" font-weight="600" fill="#eeeef4">Systems that run in production — not demos.</text>

  <!-- column dividers -->
  <line x1="330" y1="120" x2="330" y2="300" stroke="#20202c"/>
  <line x1="600" y1="120" x2="600" y2="300" stroke="#20202c"/>
  <line x1="870" y1="120" x2="870" y2="300" stroke="#20202c"/>

  <!-- col 1 — LLM & Agents -->
  <g transform="translate(70,0)">
    <g class="orb">
      <circle class="g" cx="22" cy="150" r="7"/>
      <circle class="g" cx="92" cy="128" r="7"/>
      <circle class="g" cx="92" cy="172" r="7"/>
      <line class="g" x1="29" y1="150" x2="85" y2="131"/>
      <line class="g" x1="29" y1="150" x2="85" y2="169"/>
    </g>
    <line class="rule" x1="0" y1="196" x2="210" y2="196" stroke="url(#acc)" stroke-width="2"/>
    <text class="sans fade" x="0" y="226" font-size="16" font-weight="700" fill="#f4f4f8">LLM &amp; Agents</text>
    <g class="mono fade f2" font-size="11.5" fill="#8a8a99">
      <text x="0" y="252">LangGraph · LangChain</text>
      <text x="0" y="272">multi-agent RAG</text>
      <text x="0" y="292">OpenAI · Gemini · Claude</text>
    </g>
  </g>

  <!-- col 2 — Computer Vision -->
  <g transform="translate(360,0)">
    <g class="orb" style="animation-delay:.6s">
      <rect class="g" x="0" y="120" width="104" height="62" rx="6"/>
      <path class="g" d="M14 120 V112 M14 182 V190 M90 120 V112 M90 182 V190"/>
      <circle class="g" cx="52" cy="151" r="13"/>
      <circle cx="52" cy="151" r="3.5" fill="#34d9c3"/>
    </g>
    <line class="rule r2" x1="0" y1="196" x2="210" y2="196" stroke="url(#acc)" stroke-width="2"/>
    <text class="sans fade f2" x="0" y="226" font-size="16" font-weight="700" fill="#f4f4f8">Computer Vision</text>
    <g class="mono fade f3" font-size="11.5" fill="#8a8a99">
      <text x="0" y="252">YOLO11-Seg · TensorRT</text>
      <text x="0" y="272">SAM 2 · VLM fallback</text>
      <text x="0" y="292">&lt;40ms real-time inference</text>
    </g>
  </g>

  <!-- col 3 — MLOps -->
  <g transform="translate(630,0)">
    <g class="spin">
      <path class="g" d="M20 151 a32 32 0 1 1 9 22"/>
      <path class="g" d="M84 151 a32 32 0 1 1 -9 -22"/>
      <path class="g" d="M29 173 l-9 3 l3 -12"/>
      <path class="g" d="M75 129 l9 -3 l-3 12"/>
    </g>
    <line class="rule r3" x1="0" y1="196" x2="210" y2="196" stroke="url(#acc)" stroke-width="2"/>
    <text class="sans fade f3" x="0" y="226" font-size="16" font-weight="700" fill="#f4f4f8">MLOps &amp; Fine-tuning</text>
    <g class="mono fade f4" font-size="11.5" fill="#8a8a99">
      <text x="0" y="252">PEFT / QLoRA · SageMaker</text>
      <text x="0" y="272">MLflow · DVC · W&amp;B</text>
      <text x="0" y="292">A/B gates · drift monitor</text>
    </g>
  </g>

  <!-- col 4 — Systems -->
  <g transform="translate(900,0)">
    <g class="orb" style="animation-delay:1s">
      <rect class="g" x="20" y="120" width="64" height="18" rx="4"/>
      <rect class="g" x="20" y="142" width="64" height="18" rx="4"/>
      <rect class="g" x="20" y="164" width="64" height="18" rx="4"/>
      <circle cx="31" cy="129" r="2.5" fill="#34d9c3"/>
      <circle cx="31" cy="151" r="2.5" fill="#34d9c3"/>
      <circle cx="31" cy="173" r="2.5" fill="#34d9c3"/>
    </g>
    <line class="rule r4" x1="0" y1="196" x2="210" y2="196" stroke="url(#acc)" stroke-width="2"/>
    <text class="sans fade f4" x="0" y="226" font-size="16" font-weight="700" fill="#f4f4f8">Backend Systems</text>
    <g class="mono fade f4" font-size="11.5" fill="#8a8a99">
      <text x="0" y="252">FastAPI · Celery · Kafka</text>
      <text x="0" y="272">GoLang · Redis · Docker</text>
      <text x="0" y="292">50+ concurrent · 99.9%</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#23232e"/>
</svg>
