<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#071a1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI',Helvetica,Arial,sans-serif; }
      .card { fill: #0a1128; stroke: #1f2b57; }
      .bar { transform-origin: left; animation: grow 6s ease-in-out infinite; }
      @keyframes grow { 0% { transform: scaleX(0); } 70%,100% { transform: scaleX(1); } }
      .stage { opacity: 1; animation: lit 6s steps(1) infinite backwards; }
      .s1 { animation-delay: 0s; } .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; }
      .s4 { animation-delay: 2.4s; } .s5 { animation-delay: 3.2s; }
      @keyframes lit { 0% { opacity: .25; } 2% { opacity: 1; } 95% { opacity: 1; } 100% { opacity: .25; } }
      .chip { animation: float 4s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-4px); } }
      .eq rect { transform-box: fill-box; transform-origin: bottom; animation: eq 1.4s ease-in-out infinite; }
      @keyframes eq { 50% { transform: scaleY(.35); } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <text x="40" y="44" class="mono" font-size="13" fill="#86efac" letter-spacing="2">03 // FOUNDER OS</text>
  <text x="40" y="70" class="sans" font-size="22" font-weight="700" fill="#f1f5f9">Two ventures. One thesis: software that runs the physical world.</text>

  <!-- Xphora card -->
  <g transform="translate(40,96)">
    <rect class="card" width="440" height="270" rx="14"/>
    <text x="24" y="38" class="sans" font-size="20" font-weight="700" fill="#67e8f9">Xphora AI</text>
    <text x="24" y="60" class="mono" font-size="11" fill="#64748b">AI engineering · infrastructure · IP</text>
    <g class="mono" font-size="12" fill="#cbd5e1">
      <g class="chip"><rect x="24" y="82" width="120" height="28" rx="14" fill="#0f1d3d" stroke="#22d3ee" stroke-opacity=".5"/><text x="84" y="101" text-anchor="middle">LLM apps</text></g>
      <g class="chip" style="animation-delay:.6s"><rect x="154" y="82" width="120" height="28" rx="14" fill="#0f1d3d" stroke="#22d3ee" stroke-opacity=".5"/><text x="214" y="101" text-anchor="middle">AI agents</text></g>
      <g class="chip" style="animation-delay:1.2s"><rect x="284" y="82" width="132" height="28" rx="14" fill="#0f1d3d" stroke="#a78bfa" stroke-opacity=".6"/><text x="350" y="101" text-anchor="middle">orchestration</text></g>
      <g class="chip" style="animation-delay:.3s"><rect x="24" y="120" width="170" height="28" rx="14" fill="#0f1d3d" stroke="#a78bfa" stroke-opacity=".6"/><text x="109" y="139" text-anchor="middle">knowledge infra</text></g>
      <g class="chip" style="animation-delay:.9s"><rect x="204" y="120" width="170" height="28" rx="14" fill="#0f1d3d" stroke="#22d3ee" stroke-opacity=".5"/><text x="289" y="139" text-anchor="middle">enterprise systems</text></g>
    </g>
    <text x="24" y="190" class="mono" font-size="11" fill="#64748b">inference load</text>
    <g class="eq" fill="url(#accent)">
      <rect x="24" y="200" width="14" height="46" rx="3"/>
      <rect x="44" y="210" width="14" height="36" rx="3" style="animation-delay:.2s"/>
      <rect x="64" y="196" width="14" height="50" rx="3" style="animation-delay:.4s"/>
      <rect x="84" y="214" width="14" height="32" rx="3" style="animation-delay:.6s"/>
      <rect x="104" y="204" width="14" height="42" rx="3" style="animation-delay:.8s"/>
      <rect x="124" y="198" width="14" height="48" rx="3" style="animation-delay:1s"/>
      <rect x="144" y="212" width="14" height="34" rx="3" style="animation-delay:1.2s"/>
    </g>
    <text x="416" y="246" text-anchor="end" class="mono" font-size="11" fill="#22d3ee">● building</text>
  </g>

  <!-- Reclevo card -->
  <g transform="translate(500,96)">
    <rect class="card" width="660" height="270" rx="14"/>
    <text x="24" y="38" class="sans" font-size="20" font-weight="700" fill="#86efac">Reclevo</text>
    <text x="24" y="60" class="mono" font-size="11" fill="#64748b">co-founder &amp; CTO · digital infrastructure for circularity</text>

    <!-- traceability pipeline -->
    <line x1="70" y1="128" x2="590" y2="128" stroke="#1f2b57" stroke-width="4" stroke-linecap="round"/>
    <rect class="bar" x="70" y="126" width="520" height="4" rx="2" fill="url(#green)"/>
    <g class="sans" font-size="12" text-anchor="middle" fill="#e2e8f0">
      <g class="stage s1"><circle cx="70" cy="128" r="14" fill="#0a1128" stroke="#22d3ee" stroke-width="2"/><text x="70" y="133" class="mono" font-size="11" fill="#22d3ee">01</text><text x="70" y="166">Collection</text><text x="70" y="182" class="mono" font-size="10" fill="#64748b">GPS · QR</text></g>
      <g class="stage s2"><circle cx="200" cy="128" r="14" fill="#0a1128" stroke="#2dd4bf" stroke-width="2"/><text x="200" y="133" class="mono" font-size="11" fill="#2dd4bf">02</text><text x="200" y="166">Transport</text><text x="200" y="182" class="mono" font-size="10" fill="#64748b">live tracking</text></g>
      <g class="stage s3"><circle cx="330" cy="128" r="14" fill="#0a1128" stroke="#34d399" stroke-width="2"/><text x="330" y="133" class="mono" font-size="11" fill="#34d399">03</text><text x="330" y="166">Facility</text><text x="330" y="182" class="mono" font-size="10" fill="#64748b">IoT · assets</text></g>
      <g class="stage s4"><circle cx="460" cy="128" r="14" fill="#0a1128" stroke="#4ade80" stroke-width="2"/><text x="460" y="133" class="mono" font-size="11" fill="#4ade80">04</text><text x="460" y="166">Disposal</text><text x="460" y="182" class="mono" font-size="10" fill="#64748b">verified</text></g>
      <g class="stage s5"><circle cx="590" cy="128" r="14" fill="#0a1128" stroke="#86efac" stroke-width="2"/><text x="590" y="133" class="mono" font-size="11" fill="#86efac">05</text><text x="590" y="166">Carbon MRV</text><text x="590" y="182" class="mono" font-size="10" fill="#64748b">evidence trail</text></g>
    </g>

    <g class="mono" font-size="11" fill="#94a3b8">
      <rect x="24" y="210" width="612" height="40" rx="8" fill="#07122a" stroke="#1f2b57"/>
      <text x="40" y="235"><tspan fill="#86efac">RwAM</tspan>  ·  <tspan fill="#86efac">RWDP</tspan>  ·  <tspan fill="#86efac">Citizen Portal</tspan>  ·  <tspan fill="#86efac">Radyus</tspan>  ·  <tspan fill="#86efac">Carbon Infra</tspan></text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="url(#green)" stroke-opacity="0.45"/>
</svg>
