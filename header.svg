<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Aakashdeep Srivastava — AI Engineer, ML Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#101019"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aa0ff"/>
      <stop offset="1" stop-color="#34d9c3"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8aa0ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8aa0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.028"/>
    </pattern>
    <style>
      .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;}
      .draw{stroke-dasharray:440;stroke-dashoffset:440;animation:draw 2s cubic-bezier(.4,0,.2,1) .4s forwards;}
      @keyframes draw{to{stroke-dashoffset:0;}}
      .rise{opacity:0;animation:rise .9s cubic-bezier(.4,0,.2,1) forwards;}
      .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.45s}.d4{animation-delay:.65s}.d5{animation-delay:.8s}
      @keyframes rise{from{opacity:0;}to{opacity:1;}}
      .spin{transform-origin:1010px 170px;animation:spin 42s linear infinite;}
      .spinr{transform-origin:1010px 170px;animation:spin 64s linear infinite reverse;}
      @keyframes spin{to{transform:rotate(360deg);}}
      .live{animation:live 2.8s ease-in-out infinite;}
      @keyframes live{0%,100%{opacity:.35;}50%{opacity:1;}}
      .halo{transform-origin:1010px 170px;animation:breathe 7s ease-in-out infinite;}
      @keyframes breathe{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.05);}}
    </style>
    <clipPath id="fr"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#fr)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle class="halo" cx="1010" cy="170" r="250" fill="url(#halo)"/>

    <!-- right motif: refined concentric rings -->
    <g fill="none" stroke-linecap="round">
      <g class="spin">
        <circle cx="1010" cy="170" r="146" stroke="url(#acc)" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="1.5 11"/>
        <circle cx="1010" cy="24" r="3.5" fill="#8aa0ff" stroke="none"/>
      </g>
      <g class="spinr">
        <circle cx="1010" cy="170" r="108" stroke="#34d9c3" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="70 26 3 26"/>
        <circle cx="902" cy="170" r="3" fill="#34d9c3" stroke="none"/>
      </g>
      <circle cx="1010" cy="170" r="68" stroke="#26263400" stroke-width="1"/>
      <circle cx="1010" cy="170" r="68" stroke="#2a2a3a" stroke-width="1"/>
      <g class="spin"><circle cx="1010" cy="170" r="68" stroke="url(#acc)" stroke-width="1.5" stroke-dasharray="110 330" stroke-opacity="0.85"/></g>
    </g>
    <text x="1010" y="179" text-anchor="middle" class="mono" font-size="30" font-weight="600" fill="#f4f4f8" letter-spacing="1">AS</text>

    <!-- left: identity -->
    <g transform="translate(72,92)">
      <text class="mono rise d1" x="2" y="0" font-size="12" letter-spacing="5" fill="#34d9c3">AI ENGINEER — ML SYSTEMS</text>
      <text class="sans rise d2" x="0" y="54" font-size="50" font-weight="700" fill="#f4f4f8" letter-spacing="-1">Aakashdeep Srivastava</text>
      <line class="draw" x1="3" y1="74" x2="443" y2="74" stroke="url(#acc)" stroke-width="2.5" stroke-linecap="round"/>
      <text class="sans rise d3" x="3" y="106" font-size="16.5" fill="#8a8a99">End-to-end ML · LLM orchestration · real-time computer vision · MLOps</text>

      <!-- status chips -->
      <g class="rise d4" transform="translate(3,128)">
        <circle cx="6" cy="14" r="4.5" fill="#34d9c3" class="live"/>
        <text x="20" y="19" class="sans" font-size="13.5" fill="#c7c7d1">Open to AI Engineer roles</text>
        <text x="236" y="19" class="sans" font-size="13.5" fill="#5e5e6d">Goa, India</text>
        <text x="330" y="19" class="sans" font-size="13.5" fill="#5e5e6d">·   IIT Madras</text>
      </g>
    </g>

    <!-- footer signal line -->
    <g class="mono rise d5" transform="translate(75,300)" font-size="12.5" fill="#6b6b7a">
      <text><tspan fill="#f4f4f8" font-weight="600">&lt;40ms</tspan> inference<tspan fill="#2f2f3d">     ·     </tspan><tspan fill="#f4f4f8" font-weight="600">99.9%</tspan> uptime<tspan fill="#2f2f3d">     ·     </tspan><tspan fill="#f4f4f8" font-weight="600">100+</tspan> models shipped<tspan fill="#2f2f3d">     ·     </tspan><tspan fill="#f4f4f8" font-weight="600">2nd/900</tspan> datathon</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#23232e"/>
  </g>
</svg>
