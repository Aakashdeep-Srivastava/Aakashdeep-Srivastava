<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="How I architect agentic AI systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#0e0e16"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aa0ff"/>
      <stop offset="1" stop-color="#34d9c3"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8aa0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8aa0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.028"/>
    </pattern>
    <style>
      .sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;}
      .edge{stroke:#242433;stroke-width:1.25;fill:none;}
      .node rect{fill:#0d0d15;stroke:#2a2a3a;stroke-width:1;}
      .pulse{transform-origin:600px 196px;animation:pulse 4s ease-in-out infinite;}
      @keyframes pulse{0%,100%{opacity:.75;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
      .ring{transform-origin:600px 196px;animation:spin 30s linear infinite;}
      @keyframes spin{to{transform:rotate(360deg);}}
      .dim{animation:dim 3s ease-in-out infinite;}
      @keyframes dim{50%{opacity:.3;}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)"/>

  <text x="60" y="52" class="mono" font-size="12" letter-spacing="5" fill="#34d9c3">02 — AGENTIC SYSTEMS</text>
  <text x="60" y="82" class="sans" font-size="21" font-weight="600" fill="#eeeef4">Specialised agents. Shared memory. A human in the loop.</text>

  <!-- edges -->
  <g>
    <path id="e1" class="edge" d="M600 196 L330 150"/>
    <path id="e2" class="edge" d="M600 196 L330 300"/>
    <path id="e3" class="edge" d="M600 196 L870 150"/>
    <path id="e4" class="edge" d="M600 196 L870 300"/>
    <path id="e5" class="edge" d="M600 196 L600 316"/>
    <path id="e6" class="edge" d="M600 196 L600 118"/>
  </g>

  <!-- travelling packets -->
  <g>
    <circle r="2.6" fill="#8aa0ff"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="2.6" fill="#34d9c3"><animateMotion dur="3.1s" begin="0.5s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="2.6" fill="#8aa0ff"><animateMotion dur="2.8s" begin="0.3s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="2.6" fill="#34d9c3"><animateMotion dur="3.3s" begin="0.9s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
    <circle r="2.6" fill="#8aa0ff"><animateMotion dur="2.3s" begin="0.6s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
    <circle r="2.6" fill="#34d9c3"><animateMotion dur="2.1s" begin="0.2s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
  </g>

  <!-- orchestrator core -->
  <circle cx="600" cy="196" r="82" fill="url(#core)" class="pulse"/>
  <g class="ring" fill="none"><circle cx="600" cy="196" r="56" stroke="url(#acc)" stroke-width="1.25" stroke-dasharray="90 262" stroke-opacity="0.8"/></g>
  <circle cx="600" cy="196" r="47" fill="#0c0c14" stroke="#2a2a3a" stroke-width="1"/>
  <text x="600" y="192" text-anchor="middle" class="sans" font-size="14.5" font-weight="700" fill="#f4f4f8">Orchestrator</text>
  <text x="600" y="210" text-anchor="middle" class="mono" font-size="9" fill="#7d7d8c" letter-spacing="1">plan · route · verify</text>

  <!-- nodes -->
  <g class="node">
    <g transform="translate(140,124)"><rect width="190" height="52" rx="11"/>
      <text x="16" y="23" class="sans" font-size="13.5" font-weight="600" fill="#e7e7ef">Research</text>
      <text x="16" y="40" class="mono" font-size="10.5" fill="#7d7d8c">ingest · search · cite</text></g>
    <g transform="translate(140,274)"><rect width="190" height="52" rx="11"/>
      <text x="16" y="23" class="sans" font-size="13.5" font-weight="600" fill="#e7e7ef">Retrieval · RAG</text>
      <text x="16" y="40" class="mono" font-size="10.5" fill="#7d7d8c">pgvector · embeddings</text></g>
    <g transform="translate(870,124)"><rect width="190" height="52" rx="11"/>
      <text x="16" y="23" class="sans" font-size="13.5" font-weight="600" fill="#e7e7ef">Tool Router</text>
      <text x="16" y="40" class="mono" font-size="10.5" fill="#7d7d8c">permission-aware exec</text></g>
    <g transform="translate(870,274)"><rect width="190" height="52" rx="11"/>
      <text x="16" y="23" class="sans" font-size="13.5" font-weight="600" fill="#e7e7ef">Evaluator</text>
      <text x="16" y="40" class="mono" font-size="10.5" fill="#7d7d8c">evals · observability</text></g>
    <g transform="translate(505,92)"><rect width="190" height="46" rx="11" stroke="#3a3a52"/>
      <text x="16" y="20" class="sans" font-size="13" font-weight="600" fill="#e7e7ef">Org Memory</text>
      <text x="16" y="36" class="mono" font-size="10" fill="#7d7d8c">state · provenance</text></g>
    <g transform="translate(505,316)"><rect width="190" height="46" rx="11" stroke="#34d9c3" stroke-opacity="0.5"/>
      <text x="16" y="20" class="sans" font-size="13" font-weight="600" fill="#e7e7ef">Human-in-the-loop</text>
      <text x="16" y="36" class="mono" font-size="10" fill="#7d7d8c">approve · correct · audit</text></g>
  </g>

  <!-- status dots -->
  <circle cx="320" cy="138" r="3" fill="#34d9c3" class="dim"/>
  <circle cx="320" cy="288" r="3" fill="#34d9c3" class="dim" style="animation-delay:.6s"/>
  <circle cx="1050" cy="138" r="3" fill="#34d9c3" class="dim" style="animation-delay:1s"/>
  <circle cx="1050" cy="288" r="3" fill="#f0b43a" class="dim" style="animation-delay:1.4s"/>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#23232e"/>
</svg>
