<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0f0b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI',Helvetica,Arial,sans-serif; }
      .edge { stroke: #1f2b57; stroke-width: 1.5; fill: none; }
      .flow { stroke: url(#accent); stroke-width: 2; fill: none; stroke-dasharray: 6 14; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -40; } }
      .node rect { fill: #0a1128; stroke: #2a3a73; }
      .breathe { transform-origin: 600px 210px; animation: br 3.2s ease-in-out infinite; }
      @keyframes br { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.12); opacity: 1; } }
      .blink { animation: bl 2s ease-in-out infinite; }
      @keyframes bl { 50% { opacity: .25; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <text x="40" y="44" class="mono" font-size="13" fill="#22d3ee" letter-spacing="2">02 // AGENTIC NETWORK</text>
  <text x="40" y="70" class="sans" font-size="22" font-weight="700" fill="#f1f5f9">Specialised agents. Shared memory. Human in the loop.</text>

  <!-- edges -->
  <g>
    <path id="p1" class="edge" d="M600 210 L215 140"/><path class="flow" d="M600 210 L215 140"/>
    <path id="p2" class="edge" d="M600 210 L215 290"/><path class="flow" d="M600 210 L215 290"/>
    <path id="p3" class="edge" d="M600 210 L600 360"/><path class="flow" d="M600 210 L600 360"/>
    <path id="p4" class="edge" d="M600 210 L985 140"/><path class="flow" d="M600 210 L985 140"/>
    <path id="p5" class="edge" d="M600 210 L985 290"/><path class="flow" d="M600 210 L985 290"/>
    <path id="p6" class="edge" d="M600 210 L600 108"/><path class="flow" d="M600 210 L600 108"/>
  </g>

  <!-- travelling packets (SMIL) -->
  <g fill="#67e8f9">
    <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.9s" begin="0.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#c4b5fd"><animateMotion dur="2.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.6s" begin="0.2s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    <circle r="4" fill="#c4b5fd"><animateMotion dur="3.1s" begin="1s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
  </g>

  <!-- orchestrator -->
  <circle cx="600" cy="210" r="90" fill="url(#core)" class="breathe"/>
  <circle cx="600" cy="210" r="52" fill="#0a1128" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="600" y="206" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Orchestrator</text>
  <text x="600" y="225" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">plan·route·verify</text>

  <!-- agent nodes -->
  <g class="node sans">
    <g transform="translate(110,112)"><rect width="210" height="56" rx="10"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#e2e8f0">Research Agent</text>
      <text x="16" y="42" font-size="11" fill="#94a3b8" class="mono">ingest · search · cite</text></g>
    <g transform="translate(110,262)"><rect width="210" height="56" rx="10"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#e2e8f0">RAG / Knowledge</text>
      <text x="16" y="42" font-size="11" fill="#94a3b8" class="mono">pgvector · embeddings</text></g>
    <g transform="translate(880,112)"><rect width="210" height="56" rx="10"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#e2e8f0">Tool Router</text>
      <text x="16" y="42" font-size="11" fill="#94a3b8" class="mono">permission-aware exec</text></g>
    <g transform="translate(880,262)"><rect width="210" height="56" rx="10"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#e2e8f0">Evaluator</text>
      <text x="16" y="42" font-size="11" fill="#94a3b8" class="mono">evals · observability</text></g>
    <g transform="translate(495,334)"><rect width="210" height="56" rx="10" style="stroke:#86efac"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#e2e8f0">Human-in-the-Loop</text>
      <text x="16" y="42" font-size="11" fill="#94a3b8" class="mono">approve · correct · audit</text></g>
    <g transform="translate(495,82)"><rect width="210" height="48" rx="10" style="stroke:#a78bfa"/>
      <text x="16" y="21" font-size="14" font-weight="700" fill="#e2e8f0">Org Memory</text>
      <text x="16" y="38" font-size="11" fill="#94a3b8" class="mono">state · provenance</text></g>
  </g>

  <!-- status dots -->
  <g>
    <circle cx="300" cy="126" r="4" fill="#28c840" class="blink"/>
    <circle cx="300" cy="276" r="4" fill="#28c840" class="blink" style="animation-delay:.5s"/>
    <circle cx="1070" cy="126" r="4" fill="#28c840" class="blink" style="animation-delay:1s"/>
    <circle cx="1070" cy="276" r="4" fill="#febc2e" class="blink" style="animation-delay:1.5s"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="url(#accent)" stroke-opacity="0.45"/>
</svg>
